<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixar Films · RIXAR STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05090f;--navy:#0b1220;--card:#0f1825;--card2:#162030;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eef2f8;--muted:#6b7b96;
  --blue:#00b4e4;--gold:#f4c94e;--red:#e8402a;
  --hit:#34d399;--flop:#f87171;--stream:#60a5fa;--ok:#94a3b8;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{background:rgba(11,18,32,0.97);border-bottom:1px solid rgba(0,180,228,0.15);position:sticky;top:0;z-index:100;padding:0.9rem 1.5rem;box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.header-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-wrap{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--blue);box-shadow:0 0 16px rgba(0,180,228,0.35);flex-shrink:0}
.logo-text-wrap{line-height:1}
.logo-main{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:0.08em;color:#fff;display:block}
.logo-main em{color:var(--blue);font-style:normal}
.pixar-mark{height:0.72em;width:auto;vertical-align:baseline;filter:invert(1);margin-right:0.12em}
.poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;display:block}
.logo-sub{font-size:9px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;display:block;margin-top:1px}
.logo-sub strong{color:var(--gold)}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border2);border-radius:10px;padding:7px 13px;min-width:180px;flex:1;max-width:280px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--blue)}
.search-box svg{color:var(--muted);flex-shrink:0}
.search-box input{font-family:'Nunito',sans-serif;font-size:13px;border:none;background:transparent;color:var(--text);outline:none;width:100%}
.search-box input::placeholder{color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border2);border-radius:10px;padding:7px 12px;white-space:nowrap}
.ctrl label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em}
.ctrl select{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;border:none;background:transparent;color:var(--text);outline:none;cursor:pointer}

/* ── STATS ── */
.stats-strip{background:rgba(0,180,228,0.05);border-bottom:1px solid rgba(0,180,228,0.1);padding:0.5rem 1.5rem}
.stats-inner{max-width:1300px;margin:0 auto;display:flex;gap:2rem;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:baseline;gap:5px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.04em;color:var(--gold)}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em}

/* ── MAIN ── */
.main{max-width:1300px;margin:0 auto;padding:1.5rem}
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:4px;width:fit-content}
.tab{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:7px 18px;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:0.02em;white-space:nowrap}
.tab:hover{color:var(--text)}
.people-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pf-chip{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:5px 13px;border-radius:999px;border:1px solid var(--border2);background:rgba(255,255,255,0.04);color:var(--muted);cursor:pointer;transition:all .2s}
.pf-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(244,201,78,0.08)}
.person-card .poster-img{object-position:50% 22%}
.person-card .cbadge{max-width:100%;overflow:hidden;text-overflow:ellipsis;min-width:0}
.person-card .card-foot{gap:6px}
.person-card .card-runtime{flex-shrink:0}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 2px 12px rgba(0,180,228,0.4)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,border-color .22s;position:relative}
.card:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 20px 50px rgba(0,0,0,.65),0 0 0 1px rgba(0,180,228,0.25);border-color:rgba(0,180,228,0.3)}
.card:active{transform:translateY(-2px)}
.poster{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden}
.poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:1rem;text-align:center;background:linear-gradient(135deg,#0d1f3c 0%,#0a1628 50%,#0f2040 100%);position:relative;overflow:hidden}
.poster-ph::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(0,180,228,0.12) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(244,201,78,0.08) 0%,transparent 60%)}
.poster-ph .en-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.5rem,5vw,2.4rem);color:#fff;line-height:1.1;letter-spacing:0.04em;word-break:break-word;position:relative;z-index:1;text-shadow:0 2px 20px rgba(0,180,228,0.5)}
.poster-ph .year-tag{position:absolute;bottom:10px;right:10px;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:0.06em;z-index:1}
.rt-badge{position:absolute;top:8px;left:8px;background:rgba(5,9,15,0.82);backdrop-filter:blur(6px);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,0.1)}
.rt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.card-body{padding:10px 12px 12px}
.card-year{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.04em;margin-bottom:3px}
.card-title{font-size:12px;font-weight:800;line-height:1.3;margin-bottom:8px;color:var(--text)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cbadge{font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.b-hit{background:rgba(52,211,153,.13);color:var(--hit)}
.b-flop{background:rgba(248,113,113,.13);color:var(--flop)}
.b-stream{background:rgba(96,165,250,.13);color:var(--stream)}
.b-ok{background:rgba(148,163,184,.1);color:var(--ok)}
.card-runtime{font-size:10px;color:var(--muted);font-weight:600}

/* ── CHART PAGE ── */
.chart-page{display:none}
.chart-page-inner{display:flex;gap:1.5rem;flex-wrap:wrap}

/* film selector */
.film-selector{width:220px;flex-shrink:0}
.film-selector h3{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-weight:700;margin-bottom:10px;padding:0 4px}
.film-list{display:flex;flex-direction:column;gap:3px;max-height:75vh;overflow-y:auto;padding-right:4px}
.film-list::-webkit-scrollbar{width:3px}
.film-list::-webkit-scrollbar-track{background:transparent}
.film-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.film-btn{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-align:left;transition:all .15s;line-height:1.3;width:100%}
.film-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);border-color:var(--border)}
.film-btn.selected{background:rgba(0,180,228,0.1);color:var(--blue);border-color:rgba(0,180,228,0.3)}
.film-btn .fyear{font-size:9px;color:var(--muted);font-weight:600;display:block;margin-top:1px}

/* chart area */
.chart-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.2rem}
.selected-info{background:var(--card);border:1px solid rgba(0,180,228,0.2);border-radius:14px;padding:1.2rem 1.4rem}
.selected-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.04em;color:#fff;line-height:1;margin-bottom:4px}
.selected-meta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.info-cell{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.info-cell-label{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);font-weight:700;margin-bottom:3px}
.info-cell-val{font-size:14px;font-weight:800;color:var(--text)}

.chart-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:1.3rem}
.chart-card-title{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--blue);font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.chart-card-title::after{content:'';flex:1;height:1px;background:rgba(0,180,228,0.15)}
.chart-legend{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.leg-dot{width:10px;height:4px;border-radius:2px;display:inline-block;flex-shrink:0}

/* compare table */
.compare-table{width:100%;border-collapse:collapse;font-size:12px}
.compare-table th{padding:8px 12px;text-align:left;background:var(--card2);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;border-bottom:1px solid var(--border)}
.compare-table th:first-child{border-radius:8px 0 0 0}
.compare-table th:last-child{border-radius:0 8px 0 0}
.compare-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.compare-table tr:last-child td{border-bottom:none}
.compare-table tr:hover td{background:rgba(255,255,255,0.02)}
.film-tag{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px;margin-right:3px}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--gold)}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-wrap{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}

/* ── MODAL ── */
.backdrop{position:fixed;inset:0;background:rgba(2,5,12,0.92);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(8px)}
.backdrop.open{opacity:1;pointer-events:all}
.sheet{background:var(--navy);border-radius:24px 24px 0 0;width:100%;max-width:720px;max-height:94vh;overflow-y:auto;transform:translateY(80px);transition:transform .32s cubic-bezier(.16,1,.3,1);border:1px solid rgba(0,180,228,0.18);border-bottom:none;position:relative}
.backdrop.open .sheet{transform:translateY(0)}
.handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:14px auto 0}
.close-btn{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border2);color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;line-height:1;transition:all .15s}
.save-btn{position:absolute;top:16px;right:54px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid var(--border2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px;z-index:2;transition:all .2s}
.save-btn svg path{fill:none}
.save-btn:hover{background:rgba(255,255,255,0.12);color:var(--text)}
.save-btn.on{color:var(--gold);border-color:rgba(244,201,78,0.45);background:rgba(244,201,78,0.1)}
.save-btn.on svg path{fill:currentColor}
.chip-k{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.saved-mark{position:absolute;top:8px;left:8px;z-index:3;width:22px;height:26px;display:flex;align-items:flex-start;justify-content:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.saved-mark svg path{fill:var(--gold)}
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.work{cursor:pointer;min-width:0}
.work .poster{border-radius:10px;border:1px solid var(--border);transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s}
.work:hover .poster{transform:translateY(-3px);border-color:rgba(0,180,228,0.45)}
.work .poster-ph{padding:.5rem}
.work .poster-ph .en-title{font-size:1rem}
.work-role{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--gold);margin-top:7px;line-height:1.35}
.work-title{font-size:11px;font-weight:800;line-height:1.35;color:var(--text);margin-top:2px}
.work-year{font-size:10px;font-weight:600;color:var(--muted)}
.saved-sec{margin-bottom:2rem}
.saved-sec-title{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--blue);font-weight:800;margin-bottom:12px}
.saved-empty{color:var(--muted);font-size:13px;font-weight:600;line-height:1.8;padding:2rem 0}
.close-btn:hover{background:rgba(255,255,255,0.12);color:var(--text)}
.m-hero{display:flex;gap:1.3rem;padding:3.2rem 1.5rem 1rem}
.m-poster-ph{width:100px;height:150px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0.75rem;background:linear-gradient(135deg,#0d1f3c,#0a1628);position:relative;overflow:hidden;border:1px solid rgba(0,180,228,0.2)}
.m-poster-ph::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(0,180,228,0.15),transparent 70%)}
.m-poster-en{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#fff;line-height:1.2;letter-spacing:0.04em;position:relative;z-index:1;text-shadow:0 2px 10px rgba(0,180,228,0.5)}
.m-info{flex:1;min-width:0;padding-top:4px}
.m-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue);background:rgba(0,180,228,0.1);border:1px solid rgba(0,180,228,0.25);border-radius:4px;padding:2px 8px;margin-bottom:6px}
.m-title{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:0.03em;line-height:1;margin-bottom:5px;color:#fff}
.m-dir{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px;font-weight:600}
.m-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:8px;border:1px solid var(--border2);color:var(--text);background:rgba(255,255,255,0.04);display:flex;align-items:center;gap:5px}
.m-body{padding:0 1.5rem 2.5rem}
.sec{margin-bottom:1.5rem}
.sec-title{font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:var(--blue);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:rgba(0,180,228,0.15)}
.story{font-size:13px;color:rgba(238,242,248,0.72);line-height:1.78;font-weight:600}
.trivia-list{display:flex;flex-direction:column;gap:8px}
.trivia-item{background:rgba(0,180,228,0.05);border:1px solid rgba(0,180,228,0.1);border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:10px 13px;font-size:12px;font-weight:600;line-height:1.65;color:rgba(238,242,248,0.82)}
.crew-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crew-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.crew-role{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);font-weight:700;margin-bottom:3px}
.crew-name{font-size:12px;font-weight:700;line-height:1.4;color:var(--text)}
.empty{padding:4rem;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .crew-grid{grid-template-columns:1fr}
  .m-hero{flex-direction:column}
  .m-poster-ph{width:100%;height:160px}
  .tabs{width:100%}
  .tab{flex:1;padding:7px 8px;text-align:center;font-size:11px}
  .film-selector{width:100%}
  .film-list{max-height:160px}
  .chart-page-inner{flex-direction:column}
}
</style>
</head>

let peopleGroup='all';
function personNames(p){return [p.name,...(p.alias||[])];}
function worksOf(p){
  const names=personNames(p),out=[];
  [...FILMS.map(f=>[f,'長編']),...SHORTS.map(f=>[f,'短編'])].forEach(([f,kind])=>{
    const roles=new Set();
    if(names.some(n=>(f.directors||'').includes(n)))roles.add('監督');
    (f.crew||[]).forEach(c=>{if(names.some(n=>c.name.includes(n)))c.role.split('・').forEach(r=>roles.add(r));});
    if(roles.has('共同監督'))roles.delete('監督');
    if(roles.size)out.push({f,kind,roles:[...roles].join('・')});
  });
  return out.sort((a,b)=>a.f.year-b.f.year);
}
function initials(p){return p.nameEn.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();}
function personPhoto(p){const ph=PEOPLE_PHOTOS[p.key];return ph?`<img class="poster-img" src="${ph.img}" alt="${p.name}" loading="lazy" onerror="this.remove()">`:'';}
function setPeopleGroup(g){peopleGroup=g;renderGrid();}
function renderPeopleFilter(){
  const el=document.getElementById('people-filter');
  el.innerHTML=Object.entries(PEOPLE_GROUPS).map(([k,v])=>`<button class="pf-chip${peopleGroup===k?' active':''}" onclick="setPeopleGroup('${k}')">${v}</button>`).join('');
}
function renderPeopleGrid(q){
  renderPeopleFilter();
  const list=PEOPLE.filter(p=>(peopleGroup==='all'||p.group===peopleGroup)&&(p.name+' '+p.nameEn+' '+p.role).toLowerCase().includes(q));

  if(!list.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

function openPerson(idx){
  const p=window._people[idx];if(!p)return;

  currentSaveId=personId(p);syncSaveBtn();document.querySelector('.sheet').scrollTop=0;

      <div class="m-dir">${p.nameEn}${p.years?'（'+p.years+'）':''}</div>
      <div class="m-chips">
        <div class="chip">${p.role}</div>
        ${nDir?`<div class="chip"><span class="chip-k">長編監督</span>${nDir}作</div>`:''}
        ${works.length?`<div class="chip"><span class="chip-k">参加</span>${works.length}作品</div>`:''}
      </div>
    </div>`;
  document.getElementById('m-body').innerHTML=`
    <div class="sec"><div class="sec-title">プロフィール</div><p class="story">${p.bio}</p></div>
    ${p.facts&&p.facts.length?`<div class="sec"><div class="sec-title">Trivia</div><div class="trivia-list">${p.facts.map(t=>`<div class="trivia-item">${t}</div>`).join('')}</div></div>`:''}
    <div class="sec"><div class="sec-title">携わった作品</div>

    </div>
    <div class="sec"><div class="sec-title">写真</div><p class="story" style="font-size:11px">${ph?`${ph.artist||'Unknown'} / ${ph.lic} — <a href="${ph.page}" target="_blank" rel="noopener" style="color:var(--blue)">Wikimedia Commons</a>`:'本人と確認できる自由利用可能な写真が見つからなかったため、写真は載せていません。'}</p></div>`;
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow='hidden';
}


// ── 保存（このブラウザ内にだけ記録） ──
const SAVE_KEY='pixar-tracker-saved';
const BM='<svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M1 0h12v17l-6-4.2L1 17z"/></svg>';
function loadSaved(){try{const v=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}
let SAVED=loadSaved();
function persistSaved(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVED));}catch(e){}}
function isSaved(id){return SAVED.includes(id);}
function filmId(f){return (SHORTS.includes(f)?'short:':'film:')+(f.titleEn||f.title);}
function personId(p){return 'person:'+p.key;}
let currentSaveId=null;
function syncSaveBtn(){
  const b=document.getElementById('save-btn');if(!b)return;
  const on=currentSaveId&&isSaved(currentSaveId);
  b.classList.toggle('on',!!on);
  document.getElementById('save-lbl').textContent=on?'保存済み':'保存';
}
function toggleSaveCurrent(){
  if(!currentSaveId)return;
  SAVED=isSaved(currentSaveId)?SAVED.filter(x=>x!==currentSaveId):[currentSaveId,...SAVED];
  persistSaved();syncSaveBtn();
  if(currentTab!=='boxoffice')renderGrid();
}
function savedMark(id){return isSaved(id)?`<div class="saved-mark">${BM}</div>`:'';}
function openFilm(f){window._list=[f];openModal(0);}
function workCard(w){
  const f=w.f,i=FILM_INDEX.push(f)-1;
  return `<div class="work" onclick="openFilm(FILM_INDEX[${i}])">
    <div class="poster"><div class="poster-ph"><div class="en-title">${(f.titleEn||f.title).toUpperCase()}</div>${posterImg(f)}</div></div>
    <div class="work-role">${w.roles}</div>
    <div class="work-title">${f.title}</div>
    <div class="work-year">${f.year}${w.kind==='短編'?' · 短編':''}</div>
  </div>`;
}
const FILM_INDEX=[];
function filmCard(f,onclick){
  const isShort=SHORTS.includes(f);
  const [bc,bl]=isShort?['b-stream','短編']:badgeCls(f);
  const sc=f.score?scoreColor(f.score):null;
  return`<div class="card" onclick="${onclick}">
      <div class="poster">
        <div class="poster-ph">
          <div class="en-title">${(f.titleEn||f.title).toUpperCase()}</div>
          <div class="year-tag">${f.year}</div>
          ${posterImg(f)}
        </div>
        ${sc?`<div class="rt-badge"><span class="rt-dot" style="background:${sc}"></span><span style="color:${sc}">${f.score}%</span></div>`:''}
        ${savedMark(filmId(f))}
      </div>
      <div class="card-body">
        <div class="card-year">${f.year}</div>
        <div class="card-title">${f.title}</div>
        <div class="card-foot"><span class="cbadge ${bc}">${bl}</span><span class="card-runtime">${f.runtime?f.runtime+'分':''}</span></div>
      </div>
    </div>`;
}
function personCard(p,onclick){
  const n=worksOf(p).length;
  return`<div class="card person-card" onclick="${onclick}">
      <div class="poster"><div class="poster-ph"><div class="en-title">${p.nameEn.toUpperCase()}</div>${personPhoto(p)}</div>${savedMark(personId(p))}</div>
      <div class="card-body">
        <div class="card-year">${PEOPLE_GROUPS[p.group]}${p.years?' · '+p.years:''}</div>
        <div class="card-title">${p.name}</div>
        <div class="card-foot"><span class="cbadge b-stream">${p.role.split('／')[0]}</span><span class="card-runtime">${n?n+'作品':''}</span></div>
      </div>
    </div>`;
}
function renderSaved(q){
  const items=SAVED.map(id=>{
    const [t,k]=[id.slice(0,id.indexOf(':')),id.slice(id.indexOf(':')+1)];
    if(t==='person'){const p=PEOPLE.find(x=>x.key===k);return p&&{t,p};}
    const f=(t==='short'?SHORTS:FILMS).find(x=>(x.titleEn||x.title)===k);return f&&{t,f};
  }).filter(Boolean).filter(x=>{
    const txt=x.p?(x.p.name+' '+x.p.nameEn):(x.f.title+' '+(x.f.titleEn||'')+' '+(x.f.directors||''));
    return txt.toLowerCase().includes(q);
  });
  const area=document.getElementById('grid'),empty=document.getElementById('empty');
  empty.style.display='none';
  if(!SAVED.length){area.innerHTML=`<div class="saved-empty" style="grid-column:1/-1">まだ何も保存していません。<br>作品や人物の詳細を開き、右上の「保存」を押すとここに並びます。</div>`;return;}
  window._savedFilms=items.filter(x=>x.f).map(x=>x.f);
  window._savedPeople=items.filter(x=>x.p).map(x=>x.p);
  const sec=(title,html)=>html?`<div class="saved-sec" style="grid-column:1/-1"><div class="saved-sec-title">${title}</div><div class="grid">${html}</div></div>`:'';
  const films=items.filter(x=>x.t==='film').map(x=>filmCard(x.f,`openFilm(window._savedFilms[${window._savedFilms.indexOf(x.f)}])`)).join('');
  const shorts=items.filter(x=>x.t==='short').map(x=>filmCard(x.f,`openFilm(window._savedFilms[${window._savedFilms.indexOf(x.f)}])`)).join('');
  const ppl=items.filter(x=>x.p).map(x=>{window._people=window._savedPeople;return personCard(x.p,`window._people=window._savedPeople;openPerson(${window._savedPeople.indexOf(x.p)})`);}).join('');
  area.innerHTML=(sec('長編映画',films)+sec('ショートフィルム',shorts)+sec('人物',ppl))||`<div class="saved-empty" style="grid-column:1/-1">該当なし</div>`;
}

let currentTab = 'films';
let boChartInst = null;
let selectedFilms = new Set();

function scoreColor(s){return s>=90?'#34d399':s>=70?'#f4c94e':'#f87171';}
function badgeCls(f){
  if(f.gross===null)return['b-stream','配信'];
  if(f.gross>=8)return['b-hit','大ヒット'];
  if(f.gross<4)return['b-flop','低迷'];
  return['b-ok','普通'];
}
function getSorted(arr){
  const k=document.getElementById('sortSel').value;
  return [...arr].sort((a,b)=>{
    const av=a[k],bv=b[k];
    if(av===null&&bv===null)return 0;if(av===null)return 1;if(bv===null)return -1;
    return bv-av;
  });
}

function switchTab(tab){
  currentTab=tab;
  ['films','shorts','boxoffice','people','saved'].forEach(t=>{
    const b=document.getElementById('tab-'+t);
    if(b) b.classList.toggle('active',t===tab);
  });
  document.getElementById('grid-area').style.display=tab==='boxoffice'?'none':'block';
  document.getElementById('chart-page').style.display=tab==='boxoffice'?'block':'none';
  // hide search/sort for boxoffice
  document.querySelector('.search-box').style.display=tab==='boxoffice'?'none':'flex';
  document.querySelector('.ctrl').style.display=(tab==='boxoffice'||tab==='people'||tab==='saved')?'none':'flex';
  document.getElementById('people-filter').style.display=tab==='people'?'flex':'none';
  if(tab==='boxoffice'){renderBoxOffice();return;}
  renderStats();renderGrid();
}

function onSearch(){renderGrid();}

function renderStats(){
  if(currentTab==='films'){
    const wg=FILMS.filter(f=>f.gross!==null);
    const tg=wg.reduce((s,f)=>s+f.gross,0);
    const ws=FILMS.filter(f=>f.score!==null);
    const as=ws.reduce((s,f)=>s+f.score,0)/ws.length;
    const maxHit=wg.reduce((a,b)=>a.gross>b.gross?a:b);
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="stat-val">${FILMS.length}</div><div class="stat-lbl">作品数</div></div>
      <div class="stat"><div class="stat-val">$${tg.toFixed(0)}億</div><div class="stat-lbl">総興行収入</div></div>
      <div class="stat"><div class="stat-val">${Math.round(as)}%</div><div class="stat-lbl">平均RT</div></div>
      <div class="stat"><div class="stat-val" style="font-size:1rem">${maxHit.titleEn}</div><div class="stat-lbl">最高興収</div></div>
    `;
  } else if(currentTab==='saved'){
    const c=t=>SAVED.filter(x=>x.startsWith(t+':')).length;
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="stat-val">${SAVED.length}</div><div class="stat-lbl">保存</div></div>
      <div class="stat"><div class="stat-val">${c('film')+c('short')}</div><div class="stat-lbl">作品</div></div>
      <div class="stat"><div class="stat-val">${c('person')}</div><div class="stat-lbl">人物</div></div>
    `;
  } else if(currentTab==='people'){
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="stat-val">${PEOPLE.length}</div><div class="stat-lbl">人物</div></div>
      <div class="stat"><div class="stat-val">${PEOPLE.filter(p=>p.group==='dir').length}</div><div class="stat-lbl">監督</div></div>
      <div class="stat"><div class="stat-val">${Object.keys(PEOPLE_PHOTOS).length}</div><div class="stat-lbl">写真あり</div></div>
    `;
  } else if(currentTab==='shorts'){
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="stat-val">${SHORTS.length}</div><div class="stat-lbl">短編作品数</div></div>
      <div class="stat"><div class="stat-val">1986〜</div><div class="stat-lbl">制作開始</div></div>
    `;
  } else {
    document.getElementById('stats').innerHTML=`
      <div class="stat"><div class="stat-val">${FILMS.length}</div><div class="stat-lbl">作品の興行収入</div></div>
    `;
  }
}

function renderGrid(){
  renderStats();
  const q=document.getElementById('search').value.toLowerCase();
  if(currentTab==='people'){renderPeopleGrid(q);return;}
  if(currentTab==='saved'){renderSaved(q);return;}
  const source=currentTab==='films'?FILMS:SHORTS;
  const filtered=getSorted(source.filter(f=>
    f.title.toLowerCase().includes(q)||(f.directors||'').toLowerCase().includes(q)||(f.titleEn||'').toLowerCase().includes(q)
  ));
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  if(!filtered.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  window._list=filtered;
  grid.innerHTML=filtered.map((f,i)=>{
    const [bc,bl]=currentTab==='films'?badgeCls(f):['b-stream','短編'];
    const sc=f.score?scoreColor(f.score):null;
    const enTitle=(f.titleEn||f.title).toUpperCase();
    return`<div class="card" onclick="openModal(${i})">
      <div class="poster">
        <div class="poster-ph">
          <div class="en-title">${enTitle}</div>
          <div class="year-tag">${f.year}</div>
          ${posterImg(f)}
        </div>
        ${sc?`<div class="rt-badge"><span class="rt-dot" style="background:${sc}"></span><span style="color:${sc}">${f.score}%</span></div>`:''}
        ${savedMark(filmId(f))}
      </div>
      <div class="card-body">
        <div class="card-year">${f.year}</div>
        <div class="card-title">${f.title}</div>
        <div class="card-foot">
          <span class="cbadge ${bc}">${bl}</span>
          <span class="card-runtime">${f.runtime?f.runtime+'分':''}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

let weeklyChartInst = null;

function renderBoxOffice(){
  renderStats();

  document.getElementById('film-list').innerHTML=sorted.map((f,i)=>`
    <button class="film-btn${selectedFilms.has(f.title)?' selected':''}" onclick="toggleFilm('${f.title.replace(/'/g,"\\'")}')">
      ${f.title}

function toggleFilm(title){
  if(selectedFilms.has(title)){selectedFilms.delete(title);}
  else{selectedFilms.add(title);}
  renderBoxOffice();
}

const COLORS=['#00b4e4','#f4c94e','#e8402a','#34d399','#a78bfa','#fb923c','#38bdf8','#f472b6','#4ade80','#facc15'];

function renderCompare(){
  const allFilms=[...FILMS].sort((a,b)=>a.year-b.year);
  const active=selectedFilms.size>0?allFilms.filter(f=>selectedFilms.has(f.title)):allFilms;

  // Selected info panel
  if(selectedFilms.size===1){
    const f=FILMS.find(x=>x.title===[...selectedFilms][0]);
    const jp=JP_GROSS[f.title]||{};
    const sc=f.score?scoreColor(f.score):null;
    const [bc,bl]=badgeCls(f);
    document.getElementById('selected-info').innerHTML=`
      <div class="selected-title">${f.title}</div>
      <div class="selected-meta">${f.year} · ${f.titleEn||''} · 監督：${f.directors}</div>
      <div class="info-grid">
        ${f.score!=null?`<div class="info-cell"><div class="info-cell-label">RT スコア</div><div class="info-cell-val" style="color:${sc}">${f.score}%</div></div>`:''}
        ${f.runtime?`<div class="info-cell"><div class="info-cell-label">上映時間</div><div class="info-cell-val">${f.runtime}分</div></div>`:''}
        ${f.gross!=null?`<div class="info-cell"><div class="info-cell-label">世界興収</div><div class="info-cell-val">$${f.gross.toFixed(2)}億</div></div>`:''}
        ${jp.us!=null?`<div class="info-cell"><div class="info-cell-label">米国興収</div><div class="info-cell-val">$${jp.us.toFixed(2)}億</div></div>`:''}
        ${jp.jp!=null?`<div class="info-cell"><div class="info-cell-label">日本興収</div><div class="info-cell-val">¥${jp.jp.toFixed(1)}億</div></div>`:''}
        ${f.budget!=null?`<div class="info-cell"><div class="info-cell-label">製作費</div><div class="info-cell-val">$${f.budget}M</div></div>`:''}
      </div>
      <div style="margin-top:10px;font-size:12px;color:rgba(238,242,248,0.65);line-height:1.65;font-weight:600">${f.story||''}</div>
    `;
  } else if(selectedFilms.size===0){
    document.getElementById('selected-info').innerHTML=`<div style="color:var(--muted);font-size:13px;font-weight:600">←左の作品名をタップして比較（複数選択OK）</div>`;
  } else {
    document.getElementById('selected-info').innerHTML=`<div style="color:var(--blue);font-size:13px;font-weight:700">${selectedFilms.size}作品を比較中</div>`;
  }

  // Chart
  const labels=active.map(f=>f.titleEn&&f.titleEn.length<14?f.titleEn:(f.titleEn||'').slice(0,12)+'…');
  const worldData=active.map(f=>f.gross||null);
  const usData=active.map(f=>JP_GROSS[f.title]?.us||null);
  const jpData=active.map(f=>JP_GROSS[f.title]?.jp?+(JP_GROSS[f.title].jp/jpyRate(f.year)).toFixed(2):null); // 億円→億$（公開年の年平均レートで換算）

  if(boChartInst)boChartInst.destroy();
  boChartInst=new Chart(document.getElementById('boChart'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'世界（億$）',data:worldData,backgroundColor:'rgba(0,180,228,0.7)',borderColor:'#00b4e4',borderWidth:1,borderRadius:3},
        {label:'米国（億$）',data:usData,backgroundColor:'rgba(244,201,78,0.7)',borderColor:'#f4c94e',borderWidth:1,borderRadius:3},
        {label:'日本（億$換算）',data:jpData,backgroundColor:'rgba(232,64,42,0.7)',borderColor:'#e8402a',borderWidth:1,borderRadius:3},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        label:ctx=>{
          const labels2=['世界','米国','日本'];
          const f=active[ctx.dataIndex];
          const jp=JP_GROSS[f.title]||{};
          if(ctx.datasetIndex===0)return `世界: $${(f.gross||0).toFixed(2)}億`;
          if(ctx.datasetIndex===1)return `米国: $${(jp.us||0).toFixed(2)}億`;
          return `日本: ¥${(jp.jp||0).toFixed(1)}億`;
        }
      }}},
      scales:{
        x:{ticks:{color:'#6b7b96',font:{size:10},autoSkip:active.length>10,maxRotation:active.length>8?55:0},grid:{color:'rgba(255,255,255,0.04)'}},

  const maxUs=Math.max(...active.map(f=>JP_GROSS[f.title]?.us||0));
  const maxJp=Math.max(...active.map(f=>JP_GROSS[f.title]?.jp||0));
  const sorted2=[...active].sort((a,b)=>(b.gross||0)-(a.gross||0));

    const usPct=jp.us?jp.us/maxUs*100:0;
    const jPct=jp.jp?jp.jp/maxJp*100:0;

    return`<tr style="${sel?'background:rgba(0,180,228,0.05)':''}">

      <td>
        <div style="font-weight:800;font-size:12px;color:${sel?'var(--blue)':'var(--text)'}">${f.title}</div>
        <div style="font-size:10px;color:var(--muted)">${f.year}</div>
      </td>
      <td>
        ${f.gross!=null?`<div class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${wPct}%;background:#00b4e4"></div></div><span style="font-size:11px;font-weight:700;white-space:nowrap">$${f.gross.toFixed(1)}億</span></div>`:'<span style="color:var(--muted);font-size:11px">—</span>'}
      </td>
      <td>
        ${jp.us!=null?`<div class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${usPct}%;background:#f4c94e"></div></div><span style="font-size:11px;font-weight:700;white-space:nowrap">$${jp.us.toFixed(1)}億</span></div>`:'<span style="color:var(--muted);font-size:11px">—</span>'}
      </td>
      <td>
        ${jp.jp!=null?`<div class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${jPct}%;background:#e8402a"></div></div><span style="font-size:11px;font-weight:700;white-space:nowrap">¥${jp.jp.toFixed(1)}億</span></div>`:'<span style="color:var(--muted);font-size:11px">—</span>'}
      </td>
      <td>${f.score!=null?`<span style="font-weight:800;color:${sc}">${f.score}%</span>`:'—'}</td>
      <td>${f.budget!=null?`<span style="font-size:11px;color:var(--muted)">$${f.budget}M</span>`:'—'}</td>
    </tr>`;
  }).join('');
}

function openModal(idx){
  const f=window._list[idx];if(!f)return;
  const sc=f.score?scoreColor(f.score):null;
  const enTitle=(f.titleEn||f.title).toUpperCase();
  const jp=JP_GROSS[f.title]||{};
  currentSaveId=filmId(f);syncSaveBtn();document.querySelector('.sheet').scrollTop=0;
  document.getElementById('m-hero').innerHTML=`
    <div class="m-poster-ph"><div class="m-poster-en">${enTitle}</div>${posterImg(f)}</div>
    <div class="m-info">
      <div class="m-badge">Pixar · ${f.year}</div>
      <div class="m-title">${f.title}</div>
      <div class="m-dir">監督：${f.directors||'—'}</div>
      <div class="m-chips">
        ${sc?`<div class="chip"><span class="chip-k">RT</span><span style="color:${sc};font-weight:800">${f.score}%</span></div>`:''}
        ${f.runtime?`<div class="chip"><span class="chip-k">上映</span>${f.runtime}分</div>`:''}
        ${f.gross!=null?`<div class="chip"><span class="chip-k">世界</span>$${f.gross.toFixed(2)}億</div>`:''}
        ${jp.us!=null?`<div class="chip"><span class="chip-k">米国</span>$${jp.us.toFixed(2)}億</div>`:''}
        ${jp.jp!=null?`<div class="chip"><span class="chip-k">日本</span>¥${jp.jp.toFixed(1)}億</div>`:''}
        ${f.budget!=null?`<div class="chip"><span class="chip-k">製作費</span>$${f.budget}M</div>`:''}
      </div>
    </div>
  `;
  document.getElementById('m-body').innerHTML=`
    <div class="sec">
      <div class="sec-title">ストーリー</div>
      <p class="story">${f.story||'—'}</p>
    </div>
    <div class="sec">
      <div class="sec-title">Trivia</div>
      <div class="trivia-list">${(f.trivia||[]).map(t=>`<div class="trivia-item">${t}</div>`).join('')||'<p class="story">情報なし</p>'}</div>
    </div>
    <div class="sec">
      <div class="sec-title">制作スタッフ</div>
      <div class="crew-grid">${(f.crew||[]).map(c=>`<div class="crew-item"><div class="crew-role">${c.role}</div><div class="crew-name">${c.name}</div></div>`).join('')||'<p class="story">情報なし</p>'}</div>
    </div>
  `;
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeBD(e){if(e.target===document.getElementById('backdrop'))closeSheet();}
function closeSheet(){document.getElementById('backdrop').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

renderStats();renderGrid();
</script>
</body>
</html>
